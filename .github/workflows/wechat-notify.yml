name: 微信定时提醒

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:      

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发送 Server酱 微信消息
        run: |
          curl -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
          -d "title=来自 GitHub 的提醒" \
          -d "desp=这是一条测试消息，如果你收到了，说明配置成功。"
      - name: 发送 WxPusher 标准推送（微信）
        run: |
          curl -X POST https://wxpusher.zjiecode.com/api/send/message \
          -H 'Content-Type: application/json' \
          -d '{
            "appToken": "${{ secrets.WXPUSHER_APP_TOKEN }}",
            "content": "早上好，该看今天的日程了",
            "summary": "每日提醒",
            "contentType": 1,
            "uids": ["${{ secrets.WXPUSHER_UID }}"]
          }'
      - name: 发送Bark通知
        run: |
          curl -X GET https://api.day.app/${{ secrets.BARK_KEY }}/每日提醒/早上好，该起床了?group=example&ttl=600
      
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 指定 Python 版本

      - name: 安装依赖
        run: pip install requests

      - name: 运行 Python 发送脚本
        env:
          # 这里把 GitHub Secrets 注入到环境变量里
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          WX_OPEN_ID: ${{ secrets.WX_OPEN_ID }}
          WX_TEMPLATE_ID: ${{ secrets.WX_TEMPLATE_ID }}
        run: python send_wechat.py
